<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairon — Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0d11; --bg2: #16181d; --bg3: #202329; --border: #282c34;
  --text: #ffffff; --muted: #8b8f9a; --dim: #4a4e58;
  --accent: #f5c842; --accent2: #3ecfb2; --accent3: #7b61ff; --orange: #ff8c42;
  --font: 'Inter', sans-serif; --mono: 'DM Mono', monospace;
  --side: 272px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; -webkit-font-smoothing: antialiased; }
a { text-decoration: none; color: inherit; }
:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; border-radius: 8px; }
svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

aside {
  width: var(--side); flex-shrink: 0; background: var(--bg2);
  display: flex; flex-direction: column; padding: 28px 0 24px;
  height: 100vh; position: sticky; top: 0;
}
.marca { display: flex; align-items: center; gap: 12px; padding: 0 24px 26px; }
.marca img { width: 36px; height: 36px; border-radius: 9px; object-fit: cover; flex-shrink: 0; }
.marca span { font-size: 22px; font-weight: 700; letter-spacing: -.5px; white-space: nowrap; }

.buscador { position: relative; padding: 0 20px 26px; }
.buscador svg { position: absolute; left: 34px; top: 12px; color: var(--muted); width: 18px; height: 18px; }
.buscador input {
  width: 100%; height: 44px; background: var(--bg3); border: 1px solid transparent; border-radius: 8px;
  color: var(--text); font-family: var(--font); font-size: 14px; padding: 0 14px 0 42px; outline: none;
}
.buscador input::placeholder { color: var(--muted); }
.buscador input:focus { border-color: var(--border); }

nav { flex: 1; overflow-y: auto; padding: 0 20px; }
nav::-webkit-scrollbar { width: 0; }
.grupo {
  font-size: 11px; font-weight: 600; color: var(--muted);
  letter-spacing: .09em; text-transform: uppercase; padding: 6px 4px 12px;
}
.grupo:not(:first-child) { padding-top: 26px; }
.item {
  display: flex; align-items: center; gap: 14px; position: relative;
  padding: 11px 12px; margin-bottom: 4px; border-radius: 8px;
  font-size: 15px; font-weight: 500; color: var(--text);
  transition: background .15s, color .15s; white-space: nowrap;
}
.item:hover { background: var(--bg3); }
.item.activo { color: var(--accent); font-weight: 600; }
.item.activo::before { content: ''; position: absolute; left: -20px; top: 6px; bottom: 6px; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }
.item.apagado { color: var(--dim); cursor: default; }
.item.apagado:hover { background: transparent; }
.chev { margin-left: auto; width: 16px; height: 16px; color: var(--muted); transition: transform .18s ease; }
.item.abierto .chev { transform: rotate(180deg); }
.pill { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--dim); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; }
.sub { display: none; margin: 0 0 6px 34px; border-left: 1px solid var(--border); padding-left: 14px; }
.sub.visible { display: block; }
.sub a { display: block; padding: 8px 0; font-size: 14px; font-weight: 400; color: var(--muted); }
.sub a:hover { color: var(--text); }
.sep { height: 1px; background: var(--border); margin: 20px 4px; }

.pie { padding: 0 20px; }
.pie .item { font-size: 15px; }
.copy { font-size: 12px; color: var(--dim); padding: 18px 24px 0; white-space: nowrap; }

main { flex: 1; padding: 48px 44px 60px; min-width: 0; }
.bienvenida h1 { font-size: 30px; font-weight: 700; letter-spacing: -.7px; }
.bienvenida p { font-size: 14px; color: var(--muted); margin-top: 8px; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 38px; }
.acceso {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
  display: flex; flex-direction: column; gap: 30px; transition: border-color .15s;
}
.acceso .cab { display: flex; align-items: center; justify-content: space-between; color: var(--muted); }
.acceso .cab span { font-family: var(--mono); font-size: 10px; }
.acceso b { font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
.acceso em { display: block; font-style: normal; font-size: 13px; color: var(--muted); margin-top: 4px; }
.acceso.libre:hover { border-color: var(--accent); }
.acceso.trabado { opacity: .45; }

@media (max-width: 860px) {
  aside { --side: 80px; padding-top: 24px; }
  aside .marca span, aside .buscador input, aside .grupo, aside .item span:not(.pill), aside .chev, aside .sub, aside .copy, aside .pill { display: none; }
  aside .marca, aside .item { justify-content: center; padding-left: 0; padding-right: 0; }
  aside .item.activo::before { left: -20px; }
  aside .buscador { display: flex; justify-content: center; padding-bottom: 18px; }
  aside .buscador svg { position: static; }
  main { padding: 30px 20px 44px; }
  .bienvenida h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<aside>
  <div class="marca">
    <img src="/static/kairon_logo.png" alt="Kairon">
    <span>Kairon</span>
  </div>

  <div class="buscador">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="filtro" type="search" placeholder="Buscar módulo" aria-label="Buscar módulo">
  </div>

  <nav id="nav"></nav>

  <div class="pie">
    <div class="sep"></div>
    <a class="item" href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 008 19.4a1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H2a2 2 0 110-4h.1A1.7 1.7 0 004.6 8a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V2a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H22a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>Configuración</span></a>
    <a class="item" href="/cdn-cgi/access/logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Salir</span></a>
    <p class="copy">© 2026 kaironsrl.com.ar</p>
  </div>
</aside>

<main>
  <div class="bienvenida">
    <h1 id="saludo">Bienvenido</h1>
    <p id="fecha"></p>
  </div>
  <div class="rejilla" id="rejilla"></div>
</main>

<script>
const ICONOS = {
  panel: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  precio: '<svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0l-7-7A2 2 0 013 12.2V5a2 2 0 012-2h7.2a2 2 0 011.4.6l7 7a2 2 0 010 2.8z"/><circle cx="8" cy="8" r="1.2"/></svg>',
  caja: '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M2 11h20"/><path d="M7 15.5h3"/></svg>',
  factura: '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',
  odoo: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
  sitio: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 010 18 15 15 0 010-18z"/></svg>',
  ruta: '<svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11a7 7 0 10-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'
};
const CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';

const MENU = [
  { grupo: 'Aplicaciones', items: [
    { nombre: 'Dashboard comercial', icono: 'panel', href: '/dashboard', activo: true, etiqueta: 'Ventas, stock y cobranzas',
      sub: ['Ventas', 'Stock', 'Clientes', 'Cobranzas', 'Objetivos'] },
    { nombre: 'Pricing',    icono: 'precio',  href: null, etiqueta: 'Costos y márgenes' },
    { nombre: 'Tesorería',  icono: 'caja',    href: null, etiqueta: 'Caja y cashflow' },
    { nombre: 'Facturas',   icono: 'factura', href: null, etiqueta: 'Compras en Odoo' }
  ]},
  { grupo: 'Accesos externos', items: [
    { nombre: 'Odoo',      icono: 'odoo',  href: 'https://kairon.odoo.com',   externo: true },
    { nombre: 'Sitio web', icono: 'sitio', href: 'https://kaironsrl.com.ar',  externo: true },
    { nombre: 'QuadMinds', icono: 'ruta',  href: 'https://www.quadminds.com', externo: true }
  ]}
];

const nav = document.getElementById('nav');
for (const g of MENU) {
  const t = document.createElement('p');
  t.className = 'grupo';
  t.textContent = g.grupo;
  nav.append(t);

  for (const it of g.items) {
    const abierto = Boolean(it.href);
    const el = document.createElement(abierto ? 'a' : 'div');
    el.className = 'item' + (abierto ? '' : ' apagado') + (it.activo ? ' activo' : '');
    el.dataset.nombre = it.nombre.toLowerCase();
    if (abierto) {
      el.href = it.href;
      if (it.externo) { el.target = '_blank'; el.rel = 'noopener'; }
    } else {
      el.setAttribute('aria-disabled', 'true');
    }
    el.innerHTML = ICONOS[it.icono] + '<span>' + it.nombre + '</span>' + (it.sub ? CHEV : '');
    if (!abierto) {
      const p = document.createElement('span');
      p.className = 'pill';
      p.textContent = 'Pronto';
      el.append(p);
    }
    nav.append(el);

    if (it.sub) {
      const caja = document.createElement('div');
      caja.className = 'sub';
      for (const s of it.sub) {
        const a = document.createElement('a');
        a.href = it.href;
        a.textContent = s;
        caja.append(a);
      }
      nav.append(caja);
      el.querySelector('.chev').addEventListener('click', ev => {
        ev.preventDefault();
        caja.classList.toggle('visible');
        el.classList.toggle('abierto');
      });
    }
  }
}

const rejilla = document.getElementById('rejilla');
for (const it of MENU[0].items) {
  const abierto = Boolean(it.href);
  const el = document.createElement(abierto ? 'a' : 'div');
  el.className = 'acceso ' + (abierto ? 'libre' : 'trabado');
  if (abierto) el.href = it.href;
  el.innerHTML = '<div class="cab">' + ICONOS[it.icono] + '<span>' + (abierto ? 'Abierto' : 'Pronto') + '</span></div>'
               + '<div><b>' + it.nombre + '</b><em>' + it.etiqueta + '</em></div>';
  rejilla.append(el);
}

document.getElementById('filtro').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  for (const el of nav.querySelectorAll('.item')) {
    el.style.display = el.dataset.nombre.includes(q) ? '' : 'none';
  }
});

document.getElementById('fecha').textContent =
  new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

fetch('/cdn-cgi/access/get-identity')
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if (!d || !d.email) return;
    const u = d.email.split('@')[0];
    document.getElementById('saludo').textContent = 'Bienvenido, ' + u.charAt(0).toUpperCase() + u.slice(1);
  })
  .catch(() => {});
</script>

</body>
</html>
